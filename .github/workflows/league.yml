name: league
# Rozpis celé ligy + FIBA data dohraných zápasů -> přepočet všech JSONů v data/<sezóna>/.
on:
  schedule:
    - cron: "17 */2 * * *"     # každé 2 hodiny
    - cron: "47 19-22 * * *"   # navíc večer po zápasech
  workflow_dispatch:
    inputs:
      season:
        description: 'Sezóna, např. 2026/27 (prázdné = podle data)'
        required: false
      debug:
        description: "Vypsat ukázky HTML rozpisu (ladění scraperu)"
        type: boolean
        default: false
      offline:
        description: "Jen přepočet z archivu (bez sítě)"
        type: boolean
        default: false
concurrency:
  group: league-build
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Testy
        run: python -m unittest discover -s tests -t .
      - name: Build sezóny
        env:
          SEASON: ${{ github.event.inputs.season }}
          DEBUG: ${{ github.event.inputs.debug }}
          OFFLINE: ${{ github.event.inputs.offline }}
        run: |
          ARGS=""
          [ -n "$SEASON" ] && ARGS="$ARGS --season $SEASON"
          [ "$DEBUG" = "true" ] && ARGS="$ARGS --debug"
          [ "$OFFLINE" = "true" ] && ARGS="$ARGS --offline"
          python -m nbl.build $ARGS
      - name: Commit dat
        run: |
          scripts/commit_data.sh "chore: league data refresh" "python -m nbl.build --no-scrape"
      # Pojistka: cron live workflow umí GitHub vynechat. Když do 3 h začíná (nebo běží) zápas
      # a live workflow neběží ani nečeká, spustit ho.
      - name: Spustit live, pokud se blíží zápas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOON=$(python3 - <<'PY'
          import json,glob,datetime as dt
          now=dt.datetime.now(dt.timezone.utc)
          for f in sorted(glob.glob('data/*/schedule.json'),reverse=True):
              for x in json.load(open(f)).get('fixtures',[]):
                  if x.get('status')=='final' or not x.get('datetime'): continue
                  t=dt.datetime.fromisoformat(x['datetime'])
                  if t-dt.timedelta(hours=3)<=now<=t+dt.timedelta(hours=2):
                      print('1'); raise SystemExit
          PY
          )
          [ -z "$SOON" ] && { echo "Žádný zápas v příštích 3 h."; exit 0; }
          ACTIVE=$(gh run list --workflow live.yml --limit 10 --json status --jq '[.[]|select(.status!="completed")]|length')
          [ "$ACTIVE" != "0" ] && { echo "live už běží/čeká ($ACTIVE)."; exit 0; }
          gh workflow run live.yml --ref "${GITHUB_REF_NAME}"
          echo "Spuštěn live."
