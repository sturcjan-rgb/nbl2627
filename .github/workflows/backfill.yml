name: backfill
# Jednorázové stažení a přepočet celé minulé sezóny (rozpis + FIBA data všech zápasů).
# Spustí se samo při změně tohoto souboru (výchozí sezóna níže), jinak ručně přes Actions.
on:
  push:
    paths: [".github/workflows/backfill.yml"]
  workflow_dispatch:
    inputs:
      season:
        description: 'Sezóna, např. 2025/26'
        required: true
        default: '2025/26'
concurrency:
  group: league-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEASON: ${{ github.event.inputs.season || '2025/26' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Testy
        run: python -m unittest discover -s tests -t .
      - name: Build sezóny
        run: python -m nbl.build --season "$SEASON"
      - name: Commit dat
        run: |
          scripts/commit_data.sh "chore: backfill $SEASON" "python -m nbl.build --season '$SEASON' --no-scrape"
